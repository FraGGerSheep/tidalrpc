<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Tidal …</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-family:Segoe UI,Arial,sans-serif;background:#0a0a0d;color:#fff}
    a{color:#33d6ff}
    .sub{color:#888;font-size:14px;margin-top:8px}
  </style>
</head>
<body>
  <h2>Opening Tidal …</h2>
  <p class="sub">Nothing happening? <a id="web">Open in the web player</a></p>
  <script>
    var params = new URLSearchParams(location.search);
    var id = params.get("id");
    var album = params.get("album");
    var deep = "tidal://track/" + (id || "");
    var web = "https://tidal.com/browse/track/" + (id || "");
    var isAndroid = /Android/i.test(navigator.userAgent);

    function buildIntent(path) {
      return "intent://" + path
        + "#Intent"
        + ";scheme=tidal"
        + ";package=com.aspiro.tidal"
        + ";action=android.intent.action.VIEW"
        + ";category=android.intent.category.BROWSABLE"
        + ";launchFlags=0x10000000"
        + ";S.browser_fallback_url=" + encodeURIComponent(web)
        + ";end";
    }
    function fireIframe(url) {
      var f = document.createElement("iframe");
      f.style.display = "none";
      f.src = url;
      document.body.appendChild(f);
    }

    document.getElementById("web").href = id ? web : "https://tidal.com";

    if (id) {
      if (isAndroid) {
        if (album) {
          fireIframe(buildIntent("album/" + album));
          setTimeout(function () { fireIframe(buildIntent("browse/track/" + id)); }, 1400);
          setTimeout(function () { try { location.href = buildIntent("browse/track/" + id); } catch (e) {} }, 2000);
        } else {
          var androidIntent = buildIntent("play/track/" + id);
          fireIframe(androidIntent);
          setTimeout(function () { try { location.href = androidIntent; } catch (e) {} }, 50);
        }
      } else {
        location.href = deep;
        setTimeout(function () {
          if (document.hasFocus()) location.href = web;
        }, 4000);
      }
    }
  </script>
</body>
</html>
