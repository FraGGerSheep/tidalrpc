<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Tidal …</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-family:Segoe UI,Arial,sans-serif;background:#0a0a0d;color:#fff}
    a{color:#33d6ff}
    .sub{color:#888;font-size:14px;margin-top:8px}
  </style>
</head>
<body>
  <h2>Opening Tidal …</h2>
  <p class="sub">Nothing happening? <a id="web">Open in the web player</a></p>
  <script>
    // Read the track id from ?id=.
    var id = new URLSearchParams(location.search).get("id");
    // tidal://track/<id> is a valid route in the Tidal deep-link router
    // (UriMatcher addURI("track","*",0)) — identical to the https app link.
    var deep = "tidal://track/" + (id || "");
    // https form: opens the app as a verified app link, otherwise the web player.
    var web = "https://tidal.com/browse/track/" + (id || "");
    document.getElementById("web").href = id ? web : "https://tidal.com";

    if (id) {
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      // Launch the Tidal app via the tidal:// scheme.
      location.href = deep;

      // Desktop only: after 4s open the web player, but only if the desktop
      // app did NOT take over — if it did, the OS focus moved to the app and
      // document.hasFocus() is false, so no redirect happens.
      // On mobile we do NOT auto-redirect to the web: loading tidal.com inside
      // the in-app browser just bounces back to Discord.
      if (!isMobile) {
        setTimeout(function () {
          if (document.hasFocus()) location.href = web;
        }, 4000);
      }
    }
  </script>
</body>
</html>
