<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Tidal …</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;
         font-family:Segoe UI,Arial,sans-serif;background:#0a0a0d;color:#fff}
    a{color:#33d6ff}
    .sub{color:#888;font-size:14px;margin-top:8px}
  </style>
</head>
<body>
  <h2>Opening Tidal …</h2>
  <p class="sub">Nothing happening? <a id="open">Tap to open Tidal</a> · <a id="web">Web player</a></p>
  <script>
    // Read the track id from ?id=.
    var id = new URLSearchParams(location.search).get("id");
    // tidal://track/<id> is a valid route in the Tidal deep-link router
    // (UriMatcher addURI("track","*",0)) — identical to the https app link.
    var deep = "tidal://track/" + (id || "");
    // https form: web player; also a verified Tidal app link on devices where
    // app-link verification has fired for tidal.com.
    var web = "https://tidal.com/browse/track/" + (id || "");

    var isAndroid = /Android/i.test(navigator.userAgent);

    // Android intent URI. Explicit action + category so the intent matches
    // Tidal's manifest filter even on a cold app start. NO launchFlags —
    // Chrome Custom Tabs manages its own task stack; NEW_TASK can fight that
    // and sometimes leaves Tidal in the background. browser_fallback_url
    // takes over only when the app is not installed.
    var androidIntent = "intent://track/" + (id || "") + "#Intent"
      + ";scheme=tidal"
      + ";package=com.aspiro.tidal"
      + ";action=android.intent.action.VIEW"
      + ";category=android.intent.category.BROWSABLE"
      + ";S.browser_fallback_url=" + encodeURIComponent(web)
      + ";end";

    // Visible tap target — a real user gesture beats every browser/WebView
    // restriction on programmatic intent:// navigation, and survives Tidal's
    // cold-start splash more reliably than an auto-redirect.
    document.getElementById("open").href = id ? (isAndroid ? androidIntent : deep) : web;
    document.getElementById("web").href  = id ? web : "https://tidal.com";

    if (id) {
      if (isAndroid) {
        // Best-effort auto-launch. If the Discord/CCT WebView blocks the
        // script-triggered intent navigation, the visible tap link above is
        // the reliable manual fallback.
        location.href = androidIntent;
      } else {
        // Desktop + iOS: try the custom scheme, then fall back to the web
        // player after 4s — but only if the app did NOT take over (OS focus
        // moves away → document.hasFocus() is false, no redirect).
        location.href = deep;
        setTimeout(function () {
          if (document.hasFocus()) location.href = web;
        }, 4000);
      }
    }
  </script>
</body>
</html>
